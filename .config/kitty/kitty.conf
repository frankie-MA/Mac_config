# Эта палитра обновляется общим переключателем тем Kitty + Neovim.
include ./catppuccin-current.conf
include ./${KITTY_OS}.conf

# Нужен переключателю для живого применения цветов из overlay-окна.
allow_remote_control yes

# ----------------------------------------------------------------------
# 1. СЛОЙ CTRL: УПРАВЛЕНИЕ ОКНАМИ (СПЛИТАМИ)
# ----------------------------------------------------------------------

# Создание сплитов с наследованием текущей директории
map ctrl+enter launch --location=hsplit --cwd=current
map ctrl+backslash launch --location=vsplit --cwd=current

# Навигация между окнами (Vim-стиль)
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

# Перемещение окон
map ctrl+shift+h move_window left
map ctrl+shift+j move_window bottom
map ctrl+shift+k move_window top
map ctrl+shift+l move_window right

# Изменение размеров окон
map ctrl+alt+h resize_window narrower 3
map ctrl+alt+j resize_window taller 3
map ctrl+alt+k resize_window shorter 3
map ctrl+alt+l resize_window wider 3

# Манипуляции с окнами и компоновкой
map ctrl+w no_op
map ctrl+shift+w close_window
map ctrl+alt+shift+w close_other_windows_in_tab
map ctrl+n launch --location=after --cwd=current
map ctrl+shift+enter next_layout

# ----------------------------------------------------------------------
# 2. СЛОЙ CTRL+SHIFT: УПРАВЛЕНИЕ ТАБАМИ
# ----------------------------------------------------------------------

# Навигация по табам
map ctrl+shift+[ previous_tab
map ctrl+shift+] next_tab
map ctrl+shift+t launch --type=tab --cwd=current
map ctrl+shift+q close_tab

# Организация табов
map ctrl+shift+r set_tab_title
map ctrl+shift+, move_tab_backward
map ctrl+shift+. move_tab_forward

# ----------------------------------------------------------------------
# 3. СЛОЙ CMD (super): РАБОТА С ТЕКСТОМ И ЧАСТЫЕ ДЕЙСТВИЯ
# ----------------------------------------------------------------------

# Режим выделения — Cmd+Shift+V, чтобы не конфликтовать с системным Cmd+V (вставка)
map super+shift+v toggle_selection
# Копировать/вставить — Cmd+C и Cmd+V оставлены дефолтными kitty (работают на macOS)
map super+y copy_to_clipboard
map super+p paste_from_clipboard

# Поиск и навигация
map super+f show_scrollback
map super+/ scroll_to_prompt -1
map super+g scroll_to_prompt 1

# Быстрые действия
map super+enter toggle_fullscreen

# ----------------------------------------------------------------------
# 4. ОСОБЫЕ КОМАНДЫ (mac-совместимые)
# ----------------------------------------------------------------------

# Grab kitten: ctrl+shift+g вместо alt+insert (Insert нет на Mac-клавиатуре)
map ctrl+shift+g kitten kitty_grab/grab.py
# Интерактивный выбор Catppuccin с живым предпросмотром.
map super+shift+p launch --type=overlay --title="Catppuccin theme" ~/.config/kitty/switch-catppuccin
# Переименование таба (дублирует ctrl+shift+r, но через kitten)
map super+shift+e kitten edit-tab-title

# ----------------------------------------------------------------------
# 5. НАСТРОЙКИ ВНЕШНЕГО ВИДА И ПОВЕДЕНИЯ
# ----------------------------------------------------------------------

# Табы
tab_bar_edge top
tab_bar_style powerline
tab_title_template "{index}: {title}"

# Окна
remember_window_size yes
enabled_layouts tall,stack
window_border_width 1
window_margin_width 15

# Курсор и шрифт
cursor_trail 10
cursor_trail_decay 0.1 0.4
font_family Fira Code
font_size 14.0

# Выделение и буфер обмена
copy_on_select yes
strip_trailing_spaces smart

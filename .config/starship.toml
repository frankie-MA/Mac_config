"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Safety net: mise-shimmed tools ($python module's uv/python3 fallback) can
# occasionally exceed the 500ms default under cold disk cache or system
# load. Root cause (uv/python having no active mise pin, forcing a PATH
# scan fallback on every shim invocation) was fixed via `mise use -g`, but
# this stays as defense-in-depth against transient spikes from any module.
command_timeout = 1000

# Порядок модулей в промпте
format = """
$directory\
$line_break\
$git_branch\
$git_state\
$git_status\
$status\
$character"""

right_format = """
$python\
$nodejs\
$cmd_duration"""

# ──────────────────────────────────────────────
# Директория
# ──────────────────────────────────────────────
[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "

# ──────────────────────────────────────────────
# Git
# ──────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = '\$'
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

# ──────────────────────────────────────────────
# Mise
# ──────────────────────────────────────────────
[mise]
# Tool versions are already shown by their language modules. Keeping this
# disabled also prevents prompt rendering from waiting on mise/network checks.
disabled = true
symbol = "mise "
format = "[$symbol$health]($style) "
style = "bold purple"
healthy_symbol = "ok"
unhealthy_symbol = "bad"

# ──────────────────────────────────────────────
# Python / uv
# ──────────────────────────────────────────────
[python]
symbol = " "
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "bold yellow"
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "uv.lock"]
detect_extensions = ["py"]
python_binary = [["uv", "run", "--no-python-downloads", "--no-project", "python"], "python3", "python"]

# ──────────────────────────────────────────────
# Node.js / mise
# ──────────────────────────────────────────────
[nodejs]
disabled = false
symbol = "node "
format = "via [$symbol$version]($style) "
style = "bold green"
detect_extensions = []
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = []

# ──────────────────────────────────────────────
# Java / mise
# Not in right_format: Java isn't installed on this machine, so the
# module can never render anyway. Re-add to right_format if that changes.
# ──────────────────────────────────────────────
[java]
disabled = true
symbol = "java "
format = "via [$symbol$version]($style) "
style = "bold red"

# ──────────────────────────────────────────────
# Docker (показывать только рядом с docker-compose.yml)
# Not in right_format: the docker CLI isn't installed on this machine,
# so the module can never render anyway. Re-add to right_format if that
# changes.
# ──────────────────────────────────────────────
[docker_context]
disabled = true
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "
only_with_files = true

# ──────────────────────────────────────────────
# Длительность команды (если > 2 сек)
# ──────────────────────────────────────────────
[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "bold yellow"

# ──────────────────────────────────────────────
# Код ошибки если команда упала
# ──────────────────────────────────────────────
[status]
disabled = false
format = '[$symbol$status]($style) '
symbol = "✗ "
style = "bold red"

# ──────────────────────────────────────────────
# Символ промпта
# ──────────────────────────────────────────────
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

# ──────────────────────────────────────────────
# Отключено (шум без пользы)
# ──────────────────────────────────────────────
[package]
disabled = true

[lua]
disabled = true

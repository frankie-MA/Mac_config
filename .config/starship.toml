"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Порядок модулей в промпте
format = """
$directory\
$line_break\
$git_branch\
$git_state\
$git_status\
$status\
$character"""

right_format = """
$mise\
$python\
$nodejs\
$java\
$docker_context\
$cmd_duration"""

# ──────────────────────────────────────────────
# Директория
# ──────────────────────────────────────────────
[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "

# ──────────────────────────────────────────────
# Git
# ──────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = '\$'
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

# ──────────────────────────────────────────────
# Mise
# ──────────────────────────────────────────────
[mise]
# Tool versions are already shown by their language modules. Keeping this
# disabled also prevents prompt rendering from waiting on mise/network checks.
disabled = true
symbol = "mise "
format = "[$symbol$health]($style) "
style = "bold purple"
healthy_symbol = "ok"
unhealthy_symbol = "bad"

# ──────────────────────────────────────────────
# Python / uv
# ──────────────────────────────────────────────
[python]
symbol = " "
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "bold yellow"
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "uv.lock"]
detect_extensions = ["py"]
python_binary = ["uv run python", "python3", "python"]

# ──────────────────────────────────────────────
# Node.js / mise
# ──────────────────────────────────────────────
[nodejs]
disabled = false
symbol = "node "
format = "via [$symbol$version]($style) "
style = "bold green"
detect_extensions = []
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = []

# ──────────────────────────────────────────────
# Java / mise
# ──────────────────────────────────────────────
[java]
disabled = false
symbol = "java "
format = "via [$symbol$version]($style) "
style = "bold red"

# ──────────────────────────────────────────────
# Docker (показывать только рядом с docker-compose.yml)
# ──────────────────────────────────────────────
[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "
only_with_files = true

# ──────────────────────────────────────────────
# Длительность команды (если > 2 сек)
# ──────────────────────────────────────────────
[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "bold yellow"

# ──────────────────────────────────────────────
# Код ошибки если команда упала
# ──────────────────────────────────────────────
[status]
disabled = false
format = '[$symbol$status]($style) '
symbol = "✗ "
style = "bold red"

# ──────────────────────────────────────────────
# Символ промпта
# ──────────────────────────────────────────────
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

# ──────────────────────────────────────────────
# Отключено (шум без пользы)
# ──────────────────────────────────────────────
[package]
disabled = true

[lua]
disabled = true
